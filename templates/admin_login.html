<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | GraphicsFamily</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary-orange: #ff9900; --dark-orange: #f26522; }
        body { 
            background: #f8f9fa; 
            height: 100vh; 
            display: flex; align-items: center; justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-card {
            width: 100%; max-width: 400px;
            padding: 40px; border-radius: 20px;
            background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-top: 5px solid var(--primary-orange);
        }
        .btn-admin {
            background: linear-gradient(to right, var(--primary-orange), var(--dark-orange));
            color: white; border: none; width: 100%; padding: 12px;
            border-radius: 10px; font-weight: bold; margin-top: 20px;
        }
        .error-msg { color: #dc3545; font-size: 0.9rem; margin-bottom: 15px; text-align: center; }
    </style>
</head>
<body>

<div class="login-card">
    <h3 class="text-center mb-4 fw-bold">ADMIN <span style="color: var(--primary-orange);">PANEL</span></h3>
    
    {% if error %}
        <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form action="/admin/login" method="POST">
        <div class="mb-3">
            <label class="form-label small fw-bold">USERNAME</label>
            <input type="text" name="username" class="form-control" placeholder="admin123" required>
        </div>
        <div class="mb-3">
            <label class="form-label small fw-bold">PASSWORD</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-admin">SIGN IN</button>
    </form>
    
    <div class="text-center mt-3">
        <a href="/" class="text-muted small text-decoration-none">← Back to Home</a>
    </div>
</div>

</body>
</html>
