<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Task | ACADSYNC</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root{--accent:#10b981;--accent-light:#ecfdf5;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--bg:#f0fdf8;}
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        body{min-height:100vh;font-family:'DM Sans',sans-serif;color:var(--text);background:var(--bg);}

        .page-header{position:relative;height:200px;overflow:hidden;}
        .ph-img{
            position:absolute;inset:0;
            background:url('https://images.pexels.com/photos/1181534/pexels-photo-1181534.jpeg?auto=compress&cs=tinysrgb&w=1600') center/cover no-repeat;
            filter:brightness(.72) saturate(.9);
        }
        .ph-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,185,129,.2) 0%,rgba(15,23,42,.6) 100%);}
        .ph-content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:space-between;}

        .topbar{display:flex;align-items:center;gap:14px;padding:16px 36px;background:rgba(255,255,255,.1);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.12);}
        .tb-back{display:flex;align-items:center;gap:7px;color:rgba(255,255,255,.8);text-decoration:none;font-size:.82rem;transition:.2s;}
        .tb-back:hover{color:#fff;}
        .tb-title{font-family:'Syne',sans-serif;font-size:.95rem;font-weight:700;flex:1;text-align:center;color:#fff;}
        .tb-badge{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:4px 12px;font-size:.74rem;color:#fff;font-weight:600;}
        .ph-text{padding:18px 36px 22px;}
        .ph-eyebrow{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:3px 11px;margin-bottom:8px;font-size:.7rem;font-weight:600;color:#fff;text-transform:uppercase;letter-spacing:.5px;}
        .ph-title{font-family:'Syne',sans-serif;font-size:1.45rem;font-weight:800;color:#fff;margin-bottom:3px;}
        .ph-sub{font-size:.82rem;color:rgba(255,255,255,.65);}

        .content{max-width:720px;margin:0 auto;padding:32px 24px 60px;}
        .card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:34px;box-shadow:0 4px 20px rgba(16,185,129,.06);animation:rise .45s both;}
        @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

        .field{margin-bottom:20px;}
        .field label{display:block;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:6px;}
        .fi{position:relative;}
        .fi i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:.8rem;pointer-events:none;}
        .fi i.top{top:13px;transform:none;}
        .fi input,.fi textarea{
            width:100%;padding:11px 11px 11px 34px;
            background:#f8fafc;border:1.5px solid var(--border);
            border-radius:10px;color:var(--text);font-size:.88rem;
            font-family:'DM Sans',sans-serif;outline:none;transition:.2s;resize:vertical;
        }
        .fi input::placeholder,.fi textarea::placeholder{color:#cbd5e1;}
        .fi input:focus,.fi textarea:focus{background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px rgba(16,185,129,.08);}
        .two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

        .hint{margin-top:7px;padding:9px 12px;background:var(--accent-light);border:1px solid rgba(16,185,129,.2);border-radius:8px;font-size:.75rem;color:#059669;display:flex;align-items:center;gap:7px;}

        .btn-submit{
            width:100%;padding:14px;margin-top:6px;
            background:linear-gradient(135deg,#10b981,#059669);
            border:none;border-radius:11px;
            font-family:'Syne',sans-serif;font-size:.9rem;font-weight:700;
            color:#fff;cursor:pointer;transition:.2s;
            box-shadow:0 4px 14px rgba(16,185,129,.3);
        }
        .btn-submit:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(16,185,129,.4);}
    </style>
</head>
<body>
    <div class="page-header">
        <div class="ph-img"></div>
        <div class="ph-overlay"></div>
        <div class="ph-content">
            <div class="topbar">
                <a href="/staff_dashboard" class="tb-back"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
                <div class="tb-title">Activity Task</div>
                <div class="tb-badge"><i class="fa-solid fa-pen-to-square" style="margin-right:4px;"></i>Activity</div>
            </div>
            <div class="ph-text">
                <div class="ph-eyebrow"><i class="fa-solid fa-pen-to-square"></i> Activity Builder</div>
                <div class="ph-title">Create an Activity Task</div>
                <div class="ph-sub">Students submit open-ended answers — auto-graded by keyword matching.</div>
            </div>
        </div>
    </div>

    <div class="content">
        <div class="card">
            <form method="POST" enctype="multipart/form-data">
                <div class="field">
                    <label>Task Title</label>
                    <div class="fi"><i class="fa-solid fa-heading"></i><input type="text" name="title" placeholder="E.g. Explain the OSI model" required></div>
                </div>
                <div class="field">
                    <label>Task Description</label>
                    <div class="fi"><i class="fa-solid fa-align-left top"></i><textarea name="description" rows="4" placeholder="Describe what students need to do…" required></textarea></div>
                </div>
                <div class="two-col">
                    <div class="field">
                        <label>Total Marks</label>
                        <div class="fi"><i class="fa-solid fa-star"></i><input type="number" name="total_marks" placeholder="10" min="1" required></div>
                    </div>
                    <div class="field">
                        <label>Task Date</label>
                        <div class="fi"><i class="fa-solid fa-calendar"></i><input type="date" name="task_date" required></div>
                    </div>
                </div>
                <div class="field">
                    <label>Model / Correct Answer</label>
                    <div class="fi"><i class="fa-solid fa-check-circle top"></i><textarea name="correct_answer" rows="3" placeholder="Enter the expected answer…" required></textarea></div>
                    <div class="hint"><i class="fa-solid fa-info-circle"></i>Keywords from this answer are used for automatic partial marking.</div>
                </div>
                <div class="field">
                    <label>Attachment (Optional)</label>
                    <div class="fi"><i class="fa-solid fa-paperclip"></i><input type="file" name="file" style="padding-top:9px;"></div>
                </div>
                <button type="submit" class="btn-submit"><i class="fa-solid fa-paper-plane" style="margin-right:7px;"></i>Publish Activity</button>
            </form>
        </div>
    </div>
</body>
</html>
