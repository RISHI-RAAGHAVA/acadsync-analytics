<!DOCTYPE html>
<html lang="en">
<head>
    <title>Upload Task</title>
    <style>
        body { font-family: sans-serif; margin: 40px; line-height: 1.6; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; margin-top: 5px; }
        button { background: #28a745; color: white; border: none; padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Upload New Activity Task</h2>
    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label>Task Title:</label>
            <input type="text" name="title" required>
        </div>
        <div class="form-group">
            <label>Description:</label>
            <textarea name="description" rows="4"></textarea>
        </div>
        <div class="form-group">
            <label>Total Marks:</label>
            <input type="number" name="total_marks" required>
        </div>
        <div class="form-group">
            <label>Correct Answer (Key):</label>
            <input type="text" name="correct_answer" placeholder="e.g., Option A or a specific value">
        </div>
    
        <div class="form-group">
            <label>Task Date:</label>
            <input type="date" name="task_date" required>
        </div>
        <div class="form-group">
            <label>Upload Reference Image/File:</label>
            <input type="file" name="task_file">
        </div>
        <button type="submit">Submit Task</button>
    </form>
</body>
</html>
