<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Performance | ACADSYNC</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root{--accent:#8b5cf6;--accent-light:#f5f3ff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;}
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        body{
            min-height:100vh;font-family:'DM Sans',sans-serif;
            display:flex;align-items:center;justify-content:center;
            position:relative;overflow:hidden;
        }
        .bg{
            position:fixed;inset:0;z-index:0;
            background:url('https://images.pexels.com/photos/590493/pexels-photo-590493.jpeg?auto=compress&cs=tinysrgb&w=1600') center/cover no-repeat;
            filter:brightness(.88) saturate(.9);
        }
        .bg-tint{position:fixed;inset:0;z-index:1;background:linear-gradient(135deg,rgba(237,233,254,.6) 0%,rgba(255,255,255,.45) 100%);}

        .wrap{
            position:relative;z-index:10;
            width:460px;max-width:95vw;
            background:rgba(255,255,255,.9);
            backdrop-filter:blur(28px) saturate(1.8);
            border:1.5px solid rgba(255,255,255,.65);
            border-radius:22px;padding:44px 40px;
            box-shadow:0 24px 56px rgba(139,92,246,.12),0 0 0 1px rgba(255,255,255,.5);
            animation:rise .55s cubic-bezier(.22,1,.36,1) both;
        }
        @keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

        .brand{display:flex;align-items:center;gap:9px;margin-bottom:28px;}
        .brand-ico{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#8b5cf6,#7c3aed);display:flex;align-items:center;justify-content:center;color:#fff;font-size:.82rem;box-shadow:0 3px 10px rgba(124,58,237,.35);}
        .brand-nm{font-family:'Syne',sans-serif;font-size:.95rem;font-weight:800;color:var(--text);}
        .brand-nm span{color:var(--accent);}

        h1{font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:800;color:var(--text);margin-bottom:5px;}
        .sub{font-size:.83rem;color:var(--muted);margin-bottom:28px;line-height:1.5;}

        .field{margin-bottom:16px;}
        .field label{display:block;font-size:.67rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:6px;}
        .fi{position:relative;}
        .fi i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:.8rem;pointer-events:none;}
        .fi input{
            width:100%;padding:11px 11px 11px 34px;
            background:#f8fafc;border:1.5px solid var(--border);
            border-radius:10px;color:var(--text);font-size:.88rem;
            font-family:'DM Sans',sans-serif;outline:none;transition:.2s;
        }
        .fi input::placeholder{color:#cbd5e1;}
        .fi input:focus{background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,92,246,.1);}

        .mark-display{display:flex;align-items:baseline;gap:6px;margin:12px 0 6px;}
        .mark-num{font-family:'Syne',sans-serif;font-size:2.8rem;font-weight:800;color:var(--accent);line-height:1;}
        .mark-denom{font-size:1rem;color:var(--muted);font-weight:500;}
        .mark-bar{height:8px;background:#f1f5f9;border-radius:4px;overflow:hidden;margin-bottom:18px;}
        .mark-fill{height:100%;background:linear-gradient(90deg,#8b5cf6,#7c3aed);border-radius:4px;width:0;transition:width .3s ease;box-shadow:0 2px 6px rgba(139,92,246,.3);}

        .btn{
            width:100%;padding:13px;
            background:linear-gradient(135deg,#8b5cf6,#7c3aed);
            border:none;border-radius:11px;
            font-family:'Syne',sans-serif;font-size:.9rem;font-weight:700;
            color:#fff;cursor:pointer;transition:.2s;
            box-shadow:0 4px 14px rgba(124,58,237,.3);
        }
        .btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(124,58,237,.4);}

        .back{text-align:center;margin-top:16px;font-size:.8rem;}
        .back a{color:var(--accent);text-decoration:none;font-weight:500;}
        .back a:hover{color:#6d28d9;}
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="bg-tint"></div>
    <div class="wrap">
        <div class="brand">
            <div class="brand-ico"><i class="fa-solid fa-chart-bar"></i></div>
            <div class="brand-nm">ACADSYNC <span>TECH</span></div>
        </div>
        <h1>Enter Mark</h1>
        <div class="sub">Record a student's performance mark for this activity task.</div>
        <form method="POST">
            <div class="field">
                <label>Student ID / Roll No.</label>
                <div class="fi"><i class="fa-solid fa-user"></i><input type="text" name="student_id" placeholder="e.g. 21CS001" required></div>
            </div>
            <div class="field">
                <label>Mark (out of 100)</label>
                <div class="fi"><i class="fa-solid fa-star"></i><input type="number" name="mark" id="markIn" placeholder="0 – 100" min="0" max="100" required oninput="update(this.value)"></div>
            </div>
            <div class="mark-display">
                <div class="mark-num" id="markNum">—</div>
                <div class="mark-denom">/ 100 pts</div>
            </div>
            <div class="mark-bar"><div class="mark-fill" id="markFill"></div></div>
            <button type="submit" class="btn"><i class="fa-solid fa-floppy-disk" style="margin-right:7px;"></i>Save Mark</button>
        </form>
        <div class="back"><a href="/staff_dashboard"><i class="fa-solid fa-arrow-left" style="margin-right:5px;"></i>Back to Dashboard</a></div>
    </div>
    <script>
        function update(v){
            const n=Math.min(100,Math.max(0,parseInt(v)||0));
            document.getElementById('markNum').textContent=n;
            document.getElementById('markFill').style.width=n+'%';
        }
    </script>
</body>
</html>
