<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student | ACADSYNC</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root{--accent:#2563eb;--accent-light:#eff6ff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--bg:#f0f6ff;}
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        body{min-height:100vh;font-family:'DM Sans',sans-serif;color:var(--text);background:var(--bg);}

        .page-header{position:relative;height:190px;overflow:hidden;}
        .ph-img{
            position:absolute;inset:0;
            background:url('https://images.pexels.com/photos/1438072/pexels-photo-1438072.jpeg?auto=compress&cs=tinysrgb&w=1600') center/cover no-repeat;
            filter:brightness(.72) saturate(.85);
        }
        .ph-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(37,99,235,.2) 0%,rgba(15,23,42,.6) 100%);}
        .ph-content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:space-between;}

        .topbar{display:flex;align-items:center;gap:14px;padding:16px 36px;background:rgba(255,255,255,.1);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.12);}
        .tb-back{display:flex;align-items:center;gap:7px;color:rgba(255,255,255,.8);text-decoration:none;font-size:.82rem;transition:.2s;}
        .tb-back:hover{color:#fff;}
        .tb-title{font-family:'Syne',sans-serif;font-size:.95rem;font-weight:700;flex:1;text-align:center;color:#fff;}
        .tb-badge{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:4px 12px;font-size:.74rem;color:#fff;font-weight:600;}
        .ph-text{padding:16px 36px 20px;}
        .ph-title{font-family:'Syne',sans-serif;font-size:1.45rem;font-weight:800;color:#fff;margin-bottom:3px;}
        .ph-sub{font-size:.82rem;color:rgba(255,255,255,.65);}

        .content{max-width:1000px;margin:0 auto;padding:30px 24px 60px;}
        .two-panel{display:grid;grid-template-columns:1fr 1fr;gap:18px;}

        .card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:30px;box-shadow:0 4px 18px rgba(37,99,235,.06);animation:rise .45s both;}
        .card.d1{animation-delay:.07s;}
        @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        .card-title{font-family:'Syne',sans-serif;font-size:.88rem;font-weight:700;color:var(--muted);margin-bottom:20px;display:flex;align-items:center;gap:8px;}
        .card-title i{color:var(--accent);}

        .field{margin-bottom:14px;}
        .field label{display:block;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:5px;}
        .fi{position:relative;}
        .fi i.ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:.78rem;pointer-events:none;}
        .fi input,.fi select{
            width:100%;padding:10px 10px 10px 32px;
            background:#f8fafc;border:1.5px solid var(--border);
            border-radius:9px;color:var(--text);font-size:.86rem;
            font-family:'DM Sans',sans-serif;outline:none;transition:.2s;appearance:none;
        }
        .fi input::placeholder{color:#cbd5e1;}
        .fi input:focus,.fi select:focus{background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.08);}
        .fi select option{background:#fff;}

        /* camera */
        .cam-wrap{position:relative;border-radius:12px;overflow:hidden;background:#0f172a;aspect-ratio:4/3;margin-bottom:14px;}
        #video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block;}
        .cam-corners{position:absolute;inset:0;pointer-events:none;}
        .corner{position:absolute;width:18px;height:18px;}
        .corner.tl{top:9px;left:9px;border-top:2px solid #3b82f6;border-left:2px solid #3b82f6;}
        .corner.tr{top:9px;right:9px;border-top:2px solid #3b82f6;border-right:2px solid #3b82f6;}
        .corner.bl{bottom:9px;left:9px;border-bottom:2px solid #3b82f6;border-left:2px solid #3b82f6;}
        .corner.br{bottom:9px;right:9px;border-bottom:2px solid #3b82f6;border-right:2px solid #3b82f6;}
        .scan{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(59,130,246,.8),transparent);animation:scan 2.5s ease-in-out infinite;}
        @keyframes scan{0%{top:10%}50%{top:88%}100%{top:10%}}

        .cam-status{text-align:center;font-size:.74rem;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:6px;}
        .live-dot{width:6px;height:6px;border-radius:50%;background:#10b981;animation:blink 1.5s infinite;}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

        .btn-capture{
            width:100%;padding:12px;
            background:linear-gradient(135deg,#2563eb,#1d4ed8);
            border:none;border-radius:10px;
            font-family:'Syne',sans-serif;font-size:.88rem;font-weight:700;
            color:#fff;cursor:pointer;transition:.2s;
            box-shadow:0 4px 12px rgba(37,99,235,.3);
        }
        .btn-capture:hover{transform:translateY(-2px);box-shadow:0 7px 20px rgba(37,99,235,.4);}
        .btn-capture:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none;}
        canvas{display:none;}

        .status-box{margin-top:10px;padding:10px 13px;border-radius:9px;font-size:.78rem;font-weight:500;display:none;align-items:center;gap:7px;}
        .status-box.success{background:#ecfdf5;border:1px solid rgba(16,185,129,.2);color:#059669;display:flex;}
        .status-box.error  {background:#fef2f2;border:1px solid rgba(239,68,68,.2);color:#dc2626;display:flex;}
        .status-box.loading{background:var(--accent-light);border:1px solid rgba(37,99,235,.2);color:var(--accent);display:flex;}

        @media(max-width:700px){.two-panel{grid-template-columns:1fr;}}
    </style>
</head>
<body>
    <div class="page-header">
        <div class="ph-img"></div>
        <div class="ph-overlay"></div>
        <div class="ph-content">
            <div class="topbar">
                <a href="/staff_dashboard" class="tb-back"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
                <div class="tb-title">Student Registration</div>
                <div class="tb-badge"><i class="fa-solid fa-camera" style="margin-right:4px;"></i>Face Capture</div>
            </div>
            <div class="ph-text">
                <div class="ph-title">Register a Student</div>
                <div class="ph-sub">Fill details and capture the student's face to complete registration.</div>
            </div>
        </div>
    </div>

    <div class="content">
        <div class="two-panel">
            <div class="card">
                <div class="card-title"><i class="fa-solid fa-address-card"></i> Student Details</div>
                <div class="field"><label>Full Name</label><div class="fi"><i class="fa-solid fa-user ic"></i><input id="name" type="text" placeholder="Student full name"></div></div>
                <div class="field"><label>Roll Number</label><div class="fi"><i class="fa-solid fa-hashtag ic"></i><input id="roll_no" type="text" placeholder="e.g. 21CS001"></div></div>
                <div class="field"><label>Email Address</label><div class="fi"><i class="fa-solid fa-envelope ic"></i><input id="email" type="email" placeholder="student@college.com"></div></div>
                <div class="field">
                    <label>Department</label>
                    <div class="fi">
                        <i class="fa-solid fa-building-columns ic"></i>
                        <select id="dept">
                            <option value="">Select Department</option>
                            <option value="CSE">Computer Science (CSE)</option>
                            <option value="ECE">Electronics (ECE)</option>
                            <option value="MECH">Mechanical (MECH)</option>
                            <option value="AIDS">AIDS</option>
                            <option value="IT">IT</option>

                        </select>
                    </div>
                </div>
                <div class="field"><label>Password</label><div class="fi"><i class="fa-solid fa-lock ic"></i><input id="password" type="password" placeholder="Create password"></div></div>
            </div>

            <div class="card d1">
                <div class="card-title"><i class="fa-solid fa-camera"></i> Face Capture</div>
                <div class="cam-wrap">
                    <video id="video" autoplay playsinline></video>
                    <div class="cam-corners">
                        <div class="corner tl"></div><div class="corner tr"></div>
                        <div class="corner bl"></div><div class="corner br"></div>
                    </div>
                    <div class="scan"></div>
                </div>
                <canvas id="canvas"></canvas>
                <div class="cam-status"><div class="live-dot"></div> Camera active — face student towards camera</div>
                <button id="regBtn" class="btn-capture" onclick="captureAndRegister()">
                    <i class="fa-solid fa-camera" style="margin-right:7px;"></i>Capture &amp; Register
                </button>
                <div id="statusBox" class="status-box"></div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        navigator.mediaDevices.getUserMedia({video:true}).then(s=>video.srcObject=s).catch(()=>showStatus('error','Camera blocked! Allow camera access.'));

        function showStatus(type, msg){
            const b=document.getElementById('statusBox');
            b.className='status-box '+type;
            b.innerHTML=`<i class="fa-solid fa-${type==='success'?'check-circle':type==='error'?'exclamation-circle':'spinner fa-spin'}"></i> ${msg}`;
        }

        function captureAndRegister(){
            const btn=document.getElementById('regBtn');
            const name=document.getElementById('name').value.trim();
            const roll_no=document.getElementById('roll_no').value.trim();
            const email=document.getElementById('email').value.trim();
            const dept=document.getElementById('dept').value;
            const password=document.getElementById('password').value;
            if(!name||!roll_no||!email||!dept||!password){showStatus('error','Please fill in all fields.');return;}
            btn.disabled=true;
            btn.innerHTML='<i class="fa-solid fa-spinner fa-spin" style="margin-right:7px;"></i>Processing…';
            showStatus('loading','Capturing face and registering…');
            const canvas=document.getElementById('canvas');
            const ctx=canvas.getContext('2d');
            canvas.width=video.videoWidth;canvas.height=video.videoHeight;
            ctx.drawImage(video,0,0);
            fetch('/register_face',{method:'POST',headers:{'Content-Type':'application/json'},
                body:JSON.stringify({name,roll_no,email,dept,password,image:canvas.toDataURL('image/jpeg')})})
            .then(r=>r.text()).then(msg=>{
                if(msg.toLowerCase().includes('success')){showStatus('success',msg);setTimeout(()=>window.location.href='/staff_dashboard',1800);}
                else{showStatus('error',msg);btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-camera" style="margin-right:7px;"></i>Capture & Register';}
            }).catch(()=>{showStatus('error','Server error. Try again.');btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-camera" style="margin-right:7px;"></i>Capture & Register';});
        }
    </script>
</body>
</html>
